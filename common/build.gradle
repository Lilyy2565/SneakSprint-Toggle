plugins {
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT"
}

repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

def node = rootProject.project(":${stonecutter.current.version}")
def mcVersion = node.property("minecraft_version")
def loaderVersion = node.property("loader_version")

version = rootProject.version
group = rootProject.group

base {
    archivesName = "${rootProject.archives_base_name}-common"
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "dev.architectury:architectury:${node.property("architectury_api_version")}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${node.property("cloth_config_version")}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}